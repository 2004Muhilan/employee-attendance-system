name: employee_attendance_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Default Icon fonts
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1

  # Networking (Connecting to Flask)
  http: ^1.6.0

  # Location & Permissions
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Local Storage (Saving User Token)
  flutter_secure_storage: ^10.0.0

  # State Management
  provider: ^6.1.5+1

  # Biometrics (Fingerprint)
  local_auth: ^3.0.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.0      # Helper for coordinates

  # Date Formatting
  intl: ^0.20.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true